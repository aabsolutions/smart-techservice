<h2 mat-dialog-title>{{ isEdit ? 'Edit User' : 'Add User' }}</h2>
<mat-dialog-content>
  <form [formGroup]="userForm" class="mt-3">
    <div class="row">
      <div class="col-6">
        <mat-form-field appearance="outline" class="w-100">
          <mat-label>Username</mat-label>
          <input matInput formControlName="username" required>
        </mat-form-field>
      </div>
      <div class="col-6">
        <mat-form-field appearance="outline" class="w-100">
          <mat-label>Email</mat-label>
          <input matInput formControlName="email" type="email">
        </mat-form-field>
      </div>
      <div class="col-12">
        <mat-form-field appearance="outline" class="w-100">
          <mat-label>Full Name</mat-label>
          <input matInput formControlName="fullName" required>
        </mat-form-field>
      </div>
      <div class="col-12">
        <mat-form-field appearance="outline" class="w-100">
          <mat-label>Password</mat-label>
          <input matInput formControlName="password" type="password" [required]="!isEdit" placeholder="{{ isEdit ? 'Leave blank to keep current' : '' }}">
        </mat-form-field>
      </div>
      <div class="col-12">
        <mat-form-field appearance="outline" class="w-100">
          <mat-label>Roles</mat-label>
          <mat-select formControlName="roles" multiple required>
            <mat-option *ngFor="let role of roles" [value]="role.name">{{ role.name }}</mat-option>
          </mat-select>
        </mat-form-field>
      </div>
    </div>
  </form>
</mat-dialog-content>
<mat-dialog-actions align="end">
  <button mat-button mat-dialog-close>Cancel</button>
  <button mat-flat-button color="primary" [disabled]="userForm.invalid" (click)="onSubmit()">Save</button>
</mat-dialog-actions>
