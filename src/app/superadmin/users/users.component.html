<section class="content">
  <div class="content-block">
    <app-breadcrumb [title]="'User Management'" [items]="['SuperAdmin']" [active_item]="'Users'"></app-breadcrumb>
    <div class="row">
      <div class="col-lg-12 col-md-12 col-sm-12 col-xs-12">
        <div class="card">
          <div class="header">
            <h2>Manage Users</h2>
            <button mat-flat-button color="primary" (click)="openDialog()">
              <mat-icon>add</mat-icon> Add User
            </button>
          </div>
          <div class="body">
            <div class="table-responsive">
              <table mat-table [dataSource]="users" class="w-100">
                <ng-container matColumnDef="username">
                  <th mat-header-cell *matHeaderCellDef> Username </th>
                  <td mat-cell *matCellDef="let user"> {{user.username}} </td>
                </ng-container>

                <ng-container matColumnDef="email">
                  <th mat-header-cell *matHeaderCellDef> Email </th>
                  <td mat-cell *matCellDef="let user"> {{user.email}} </td>
                </ng-container>

                <ng-container matColumnDef="name">
                  <th mat-header-cell *matHeaderCellDef> Name </th>
                  <td mat-cell *matCellDef="let user"> {{user.fullName}} </td>
                </ng-container>

                <ng-container matColumnDef="roles">
                  <th mat-header-cell *matHeaderCellDef> Roles </th>
                  <td mat-cell *matCellDef="let user">
                    <span *ngFor="let role of user.roles" class="badge bg-primary me-1">{{role.name}}</span>
                  </td>
                </ng-container>

                <ng-container matColumnDef="status">
                  <th mat-header-cell *matHeaderCellDef> Status </th>
                  <td mat-cell *matCellDef="let user">
                    <span class="badge" [ngClass]="user.isActive ? 'bg-success' : 'bg-danger'">
                      {{user.isActive ? 'Active' : 'Inactive'}}
                    </span>
                  </td>
                </ng-container>

                <ng-container matColumnDef="actions">
                  <th mat-header-cell *matHeaderCellDef> Actions </th>
                  <td mat-cell *matCellDef="let user">
                    <button mat-icon-button color="accent" (click)="openDialog(user)">
                      <mat-icon>edit</mat-icon>
                    </button>
                    <button mat-icon-button color="warn" (click)="deactivate(user._id)">
                      <mat-icon>delete</mat-icon>
                    </button>
                  </td>
                </ng-container>

                <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
                <tr mat-row *matRowDef="let row; columns: displayedColumns;"></tr>
              </table>
            </div>
          </div>
        </div>
      </div>
    </div>
  </div>
</section>
