<section class="content">
  <div class="content-block">
    <app-breadcrumb [title]="'Roles Management'" [items]="['SuperAdmin']" [active_item]="'Roles'"></app-breadcrumb>
    <div class="row">
      <div class="col-lg-12 col-md-12 col-sm-12 col-xs-12">
        <div class="card">
          <div class="header">
            <h2>Roles View</h2>
          </div>
          <div class="body">
            <div class="table-responsive">
              <table mat-table [dataSource]="roles" class="w-100">
                <ng-container matColumnDef="name">
                  <th mat-header-cell *matHeaderCellDef> Name </th>
                  <td mat-cell *matCellDef="let role"> {{role.name}} </td>
                </ng-container>

                <ng-container matColumnDef="description">
                  <th mat-header-cell *matHeaderCellDef> Description </th>
                  <td mat-cell *matCellDef="let role"> {{role.description}} </td>
                </ng-container>

                <ng-container matColumnDef="priority">
                  <th mat-header-cell *matHeaderCellDef> Priority </th>
                  <td mat-cell *matCellDef="let role"> {{role.priority}} </td>
                </ng-container>

                <ng-container matColumnDef="permissions">
                  <th mat-header-cell *matHeaderCellDef> Permissions </th>
                  <td mat-cell *matCellDef="let role">
                    <span class="badge bg-secondary me-1">{{role.permissions?.length}} perms</span>
                  </td>
                </ng-container>

                <ng-container matColumnDef="system">
                  <th mat-header-cell *matHeaderCellDef> Is System </th>
                  <td mat-cell *matCellDef="let role">
                    <span class="badge" [ngClass]="role.isSystem ? 'bg-primary' : 'bg-info'">{{role.isSystem ? 'Yes' : 'No'}}</span>
                  </td>
                </ng-container>

                <ng-container matColumnDef="actions">
                  <th mat-header-cell *matHeaderCellDef> Acciones </th>
                  <td mat-cell *matCellDef="let role">
                    <button mat-icon-button color="primary" (click)="editPermissions(role)">
                      <mat-icon>security</mat-icon>
                    </button>
                  </td>
                </ng-container>

                <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
                <tr mat-row *matRowDef="let row; columns: displayedColumns;"></tr>
              </table>
            </div>
          </div>
        </div>
      </div>
    </div>
  </div>
</section>
