<section class="content">
  <div class="content-block">
    <app-breadcrumb [title]="'Audit Logs'" [items]="['SuperAdmin']" [active_item]="'Audit Logs'"></app-breadcrumb>
    <div class="row">
      <div class="col-lg-12 col-md-12 col-sm-12 col-xs-12">
        <div class="card">
          <div class="header">
            <h2>System Audit Logs</h2>
          </div>
          <div class="body">
            <div class="table-responsive">
              <table mat-table [dataSource]="logs" class="w-100">
                <ng-container matColumnDef="timestamp">
                  <th mat-header-cell *matHeaderCellDef> Date </th>
                  <td mat-cell *matCellDef="let log"> {{log.timestamp | date:'medium'}} </td>
                </ng-container>

                <ng-container matColumnDef="action">
                  <th mat-header-cell *matHeaderCellDef> Action </th>
                  <td mat-cell *matCellDef="let log"> <span class="badge bg-primary">{{log.action}}</span> </td>
                </ng-container>

                <ng-container matColumnDef="performedBy">
                  <th mat-header-cell *matHeaderCellDef> Performed By </th>
                  <td mat-cell *matCellDef="let log"> {{log.performedBy?.username || log.performedBy}} </td>
                </ng-container>

                <ng-container matColumnDef="targetUser">
                  <th mat-header-cell *matHeaderCellDef> Target User </th>
                  <td mat-cell *matCellDef="let log"> {{log.targetUser?.username || log.targetUser || '-'}} </td>
                </ng-container>

                <ng-container matColumnDef="ip">
                  <th mat-header-cell *matHeaderCellDef> IP Address </th>
                  <td mat-cell *matCellDef="let log"> {{log.ip || '-'}} </td>
                </ng-container>

                <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
                <tr mat-row *matRowDef="let row; columns: displayedColumns;"></tr>
              </table>
            </div>
          </div>
        </div>
      </div>
    </div>
  </div>
</section>
