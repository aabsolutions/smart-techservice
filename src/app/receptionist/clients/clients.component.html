<section class="content">
  <div class="content-block">
    <app-breadcrumb [title]="'Clients'" [items]="['Receptionist']" [active_item]="'Clients'"></app-breadcrumb>
    <div class="row">
      <div class="col-lg-12 col-md-12 col-sm-12 col-xs-12">
        <div class="card">
          <div class="header">
            <h2>Manage Clients</h2>
            <button mat-flat-button color="primary" (click)="openDialog()">
              <mat-icon>add</mat-icon> Add Client
            </button>
          </div>
          <div class="body">
            <div class="table-responsive">
              <table mat-table [dataSource]="clients" class="w-100">
                <ng-container matColumnDef="cedula">
                  <th mat-header-cell *matHeaderCellDef> Cédula </th>
                  <td mat-cell *matCellDef="let client"> {{client.cedula}} </td>
                </ng-container>

                <ng-container matColumnDef="fullName">
                  <th mat-header-cell *matHeaderCellDef> Full Name </th>
                  <td mat-cell *matCellDef="let client"> {{client.fullName}} </td>
                </ng-container>

                <ng-container matColumnDef="phone">
                  <th mat-header-cell *matHeaderCellDef> Phone </th>
                  <td mat-cell *matCellDef="let client"> {{client.phone}} </td>
                </ng-container>

                <ng-container matColumnDef="email">
                  <th mat-header-cell *matHeaderCellDef> Email </th>
                  <td mat-cell *matCellDef="let client"> {{client.email}} </td>
                </ng-container>

                <ng-container matColumnDef="actions">
                  <th mat-header-cell *matHeaderCellDef> Actions </th>
                  <td mat-cell *matCellDef="let client">
                    <button mat-icon-button color="accent" (click)="openDialog(client)">
                      <mat-icon>edit</mat-icon>
                    </button>
                    <button mat-icon-button color="warn" (click)="deactivate(client._id)">
                      <mat-icon>delete</mat-icon>
                    </button>
                  </td>
                </ng-container>

                <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
                <tr mat-row *matRowDef="let row; columns: displayedColumns;"></tr>
              </table>
            </div>
          </div>
        </div>
      </div>
    </div>
  </div>
</section>
