<h2 mat-dialog-title>{{ isEdit ? 'Edit Client' : 'Add Client' }}</h2>
<mat-dialog-content>
  <form [formGroup]="clientForm" class="mt-3">
    <div class="row">
      <div class="col-6">
        <mat-form-field appearance="outline" class="w-100">
          <mat-label>Cédula</mat-label>
          <input matInput formControlName="cedula" required>
        </mat-form-field>
      </div>
      <div class="col-6">
        <mat-form-field appearance="outline" class="w-100">
          <mat-label>Full Name</mat-label>
          <input matInput formControlName="fullName" required>
        </mat-form-field>
      </div>
      <div class="col-6">
        <mat-form-field appearance="outline" class="w-100">
          <mat-label>Phone (Celular)</mat-label>
          <input matInput formControlName="phone" required>
        </mat-form-field>
      </div>
      <div class="col-6">
        <mat-form-field appearance="outline" class="w-100">
          <mat-label>Email (Opcional)</mat-label>
          <input matInput formControlName="email" type="email">
        </mat-form-field>
      </div>
      <div class="col-12">
        <mat-form-field appearance="outline" class="w-100">
          <mat-label>Address (Opcional)</mat-label>
          <input matInput formControlName="address">
        </mat-form-field>
      </div>
    </div>
  </form>
</mat-dialog-content>
<mat-dialog-actions align="end">
  <button mat-button mat-dialog-close>Cancel</button>
  <button mat-flat-button color="primary" [disabled]="clientForm.invalid" (click)="onSubmit()">Save</button>
</mat-dialog-actions>
