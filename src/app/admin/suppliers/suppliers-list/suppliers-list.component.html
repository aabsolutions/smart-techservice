<section class="content">
  <div class="content-block">
    <div class="block-header">
      <app-breadcrumb [title]="'Gestión de Proveedores'" [items]="['Compras']" [active_item]="'Proveedores'"></app-breadcrumb>
    </div>
    <div class="row clearfix">
      <div class="col-xs-12 col-sm-12 col-md-12 col-lg-12">
        <div class="card">
          <div class="header flex justify-between items-center">
            <h2>Listado de Proveedores</h2>
            <button mat-raised-button color="primary" (click)="openForm()">
              <mat-icon>add</mat-icon> Nuevo Proveedor
            </button>
          </div>
          <div class="body">
            <div class="table-responsive">
              <table mat-table [dataSource]="suppliers" class="w-100">
                
                <ng-container matColumnDef="ruc">
                  <th mat-header-cell *matHeaderCellDef> RUC / Doc </th>
                  <td mat-cell *matCellDef="let sup"> {{ sup.ruc }} </td>
                </ng-container>

                <ng-container matColumnDef="name">
                  <th mat-header-cell *matHeaderCellDef> Razón Social </th>
                  <td mat-cell *matCellDef="let sup"> {{ sup.name }} </td>
                </ng-container>

                <ng-container matColumnDef="contactPerson">
                  <th mat-header-cell *matHeaderCellDef> Contacto </th>
                  <td mat-cell *matCellDef="let sup"> {{ sup.contactPerson || 'N/A' }} </td>
                </ng-container>

                <ng-container matColumnDef="phone">
                  <th mat-header-cell *matHeaderCellDef> Teléfono </th>
                  <td mat-cell *matCellDef="let sup"> {{ sup.phone || 'N/A' }} </td>
                </ng-container>

                <ng-container matColumnDef="status">
                  <th mat-header-cell *matHeaderCellDef> Estado </th>
                  <td mat-cell *matCellDef="let sup">
                    <span class="badge" [ngClass]="sup.isActive ? 'bg-success' : 'bg-danger'">
                      {{ sup.isActive ? 'Activo' : 'Inactivo' }}
                    </span>
                  </td>
                </ng-container>

                <ng-container matColumnDef="actions">
                  <th mat-header-cell *matHeaderCellDef> Acciones </th>
                  <td mat-cell *matCellDef="let sup">
                    <button mat-icon-button color="primary" (click)="openForm(sup)" matTooltip="Editar">
                      <mat-icon>edit</mat-icon>
                    </button>
                    <button mat-icon-button color="warn" (click)="deleteSupplier(sup)" matTooltip="Eliminar">
                      <mat-icon>delete</mat-icon>
                    </button>
                  </td>
                </ng-container>

                <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
                <tr mat-row *matRowDef="let row; columns: displayedColumns;"></tr>
              </table>

              <div *ngIf="suppliers.length === 0" class="p-4 text-center text-muted">
                No hay proveedores registrados aún.
              </div>
            </div>
          </div>
        </div>
      </div>
    </div>
  </div>
</section>
