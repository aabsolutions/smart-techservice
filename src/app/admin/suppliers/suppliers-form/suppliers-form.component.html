<h2 mat-dialog-title>{{ isEdit ? 'Editar Proveedor' : 'Nuevo Proveedor' }}</h2>
<mat-dialog-content>
  <form [formGroup]="supplierForm" class="mt-3">
    <div class="row">
      <div class="col-md-5 mb-3">
        <mat-form-field appearance="outline" class="w-100">
          <mat-label>RUC / Documento</mat-label>
          <input matInput formControlName="ruc" required>
        </mat-form-field>
      </div>
      <div class="col-md-7 mb-3">
        <mat-form-field appearance="outline" class="w-100">
          <mat-label>Razón Social / Nombre</mat-label>
          <input matInput formControlName="name" required>
        </mat-form-field>
      </div>
    </div>
    
    <div class="row">
      <div class="col-md-6 mb-3">
        <mat-form-field appearance="outline" class="w-100">
          <mat-label>Persona de Contacto</mat-label>
          <input matInput formControlName="contactPerson">
        </mat-form-field>
      </div>
      <div class="col-md-6 mb-3">
        <mat-form-field appearance="outline" class="w-100">
          <mat-label>Teléfono</mat-label>
          <input matInput formControlName="phone">
        </mat-form-field>
      </div>
    </div>

    <div class="row">
      <div class="col-md-12 mb-3">
        <mat-form-field appearance="outline" class="w-100">
          <mat-label>Correo Electrónico</mat-label>
          <input matInput type="email" formControlName="email">
        </mat-form-field>
      </div>
    </div>

    <div class="row">
      <div class="col-md-12 mb-3">
        <mat-form-field appearance="outline" class="w-100">
          <mat-label>Dirección</mat-label>
          <textarea matInput formControlName="address" rows="2"></textarea>
        </mat-form-field>
      </div>
    </div>

    <div class="row">
      <div class="col-md-12 mb-3">
        <mat-slide-toggle formControlName="isActive" color="primary">
          Estado: {{ supplierForm.get('isActive')?.value ? 'Activo' : 'Inactivo' }}
        </mat-slide-toggle>
      </div>
    </div>
  </form>
</mat-dialog-content>
<mat-dialog-actions align="end">
  <button mat-button mat-dialog-close>Cancelar</button>
  <button mat-raised-button color="primary" [disabled]="supplierForm.invalid" (click)="onSubmit()">
    Guardar
  </button>
</mat-dialog-actions>
