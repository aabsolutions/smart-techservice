<h2 mat-dialog-title>{{ isEdit ? 'Editar Pieza' : 'Nueva Pieza' }}</h2>
<mat-dialog-content>
  <form [formGroup]="partForm" class="mt-3">
    <div class="row">
      <div class="col-md-6 mb-3">
        <mat-form-field appearance="outline" class="w-100">
          <mat-label>Código / SKU</mat-label>
          <input matInput formControlName="code" required>
        </mat-form-field>
      </div>
      <div class="col-md-6 mb-3">
        <mat-form-field appearance="outline" class="w-100">
          <mat-label>Nombre de la Pieza</mat-label>
          <input matInput formControlName="name" required>
        </mat-form-field>
      </div>
    </div>
    
    <div class="row">
      <div class="col-md-12 mb-3">
        <mat-form-field appearance="outline" class="w-100">
          <mat-label>Descripción</mat-label>
          <textarea matInput formControlName="description" rows="2"></textarea>
        </mat-form-field>
      </div>
    </div>

    <div class="row">
      <div class="col-md-4 mb-3">
        <mat-form-field appearance="outline" class="w-100">
          <mat-label>Precio de Venta</mat-label>
          <input matInput type="number" formControlName="price" required>
        </mat-form-field>
      </div>
      <div class="col-md-4 mb-3">
        <mat-form-field appearance="outline" class="w-100">
          <mat-label>Costo</mat-label>
          <input matInput type="number" formControlName="cost">
        </mat-form-field>
      </div>
      <div class="col-md-4 mb-3">
        <mat-form-field appearance="outline" class="w-100">
          <mat-label>Stock</mat-label>
          <input matInput type="number" formControlName="stock">
        </mat-form-field>
      </div>
    </div>

    <div class="row">
      <div class="col-md-4 mb-3">
        <mat-form-field appearance="outline" class="w-100">
          <mat-label>Categoría</mat-label>
          <mat-select formControlName="category">
            <mat-option *ngFor="let cat of categories" [value]="cat.name">{{ cat.name }}</mat-option>
          </mat-select>
          <button mat-icon-button matSuffix (click)="$event.stopPropagation(); addCategory()" color="accent" matTooltip="Nueva Categoría">
            <mat-icon>add</mat-icon>
          </button>
        </mat-form-field>
      </div>
      <div class="col-md-4 mb-3">
        <mat-form-field appearance="outline" class="w-100">
          <mat-label>Proveedor (Opcional)</mat-label>
          <mat-select formControlName="supplierId">
            <mat-option [value]="null">-- Ninguno --</mat-option>
            <mat-option *ngFor="let sup of suppliers" [value]="sup._id">{{ sup.name }}</mat-option>
          </mat-select>
          <button mat-icon-button matSuffix (click)="$event.stopPropagation(); addSupplier()" color="accent" matTooltip="Nuevo Proveedor">
            <mat-icon>add</mat-icon>
          </button>
        </mat-form-field>
      </div>
      <div class="col-md-4 mb-3 d-flex align-items-center">
        <mat-slide-toggle formControlName="isActive" color="primary">
          Estado: {{ partForm.get('isActive')?.value ? 'Activo' : 'Inactivo' }}
        </mat-slide-toggle>
      </div>
    </div>
  </form>
</mat-dialog-content>
<mat-dialog-actions align="end">
  <button mat-button mat-dialog-close>Cancelar</button>
  <button mat-raised-button color="primary" [disabled]="partForm.invalid" (click)="onSubmit()">
    Guardar
  </button>
</mat-dialog-actions>
